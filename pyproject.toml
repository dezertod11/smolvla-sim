[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-sim"
version = "0.1.0"
description = "SmolVLA, LIBERO and ROS2 development workspace"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "ros2_ws/log", ".tools", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
